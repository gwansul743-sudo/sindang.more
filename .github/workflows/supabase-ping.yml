# Supabase 무료 플랜은 1주일 동안 요청이 없으면 일시정지된다. 월요일 아침마다 가게 표를 한 번 읽어 깨어 있게 한다.
# GitHub 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL, SUPABASE_ANON_KEY 를 넣어야 돈다.
name: supabase-ping
on:
  schedule:
    - cron: '17 0 * * 1'   # 매주 월요일 09:17 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" "${{ secrets.SUPABASE_URL }}/rest/v1/stores?select=id&limit=1" > /dev/null && echo ok
